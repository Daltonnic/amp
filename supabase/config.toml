# Supabase CLI configuration. `supabase start` runs this stack locally;
# `supabase link` + `supabase db push` / `supabase functions deploy` ship it.
project_id = "amp-the-journey"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing UI (http://localhost:54324) — sign-in codes land here.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["capacitor://localhost", "https://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Passwordless: users sign in with a 6-digit code emailed to them.
enable_confirmations = false
otp_length = 6
otp_expiry = 900
max_frequency = "30s"

[auth.email.template.magic_link]
subject = "Your AMP sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your AMP sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.rate_limit]
email_sent = 30
token_verifications = 30

# Functions verify the caller's token themselves (see _shared/http.ts), which
# works with both legacy and new Supabase API keys.
[functions.send-support-email]
verify_jwt = false

[functions.grounding-guide]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
