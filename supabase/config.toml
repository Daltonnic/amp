# Supabase CLI configuration. `supabase start` runs this stack locally;
# `supabase link` + `supabase db push` / `supabase functions deploy` ship it.
project_id = "amp-the-journey"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000
# Match the cloud project: tables are only reachable through the API with
# explicit GRANTs (see the api_grants migration).
auto_expose_new_tables = false

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
# Local email testing UI (http://localhost:54324) — sign-in codes land here.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["capacitor://localhost", "https://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
# Email + password; accounts work immediately (no confirmation email).
enable_confirmations = false
otp_length = 6
otp_expiry = 900
max_frequency = "30s"

[auth.rate_limit]
email_sent = 30
token_verifications = 30

# Functions verify the caller's token themselves (see _shared/http.ts), which
# works with both legacy and new Supabase API keys.
[functions.grounding-guide]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
